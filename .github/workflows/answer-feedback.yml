name: Answer understanding feedback
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-understanding-answer-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false
jobs:
  feedback:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      startsWith(github.event.comment.body, '/answer') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # issue_comment resolves github.sha to trusted default-branch code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate answer and publish feedback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_PROVIDER: openai
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXCLUDE_GLOBS: ${{ vars.EXCLUDE_GLOBS }}
        run: python -m pr_understanding.answer_cli --post
