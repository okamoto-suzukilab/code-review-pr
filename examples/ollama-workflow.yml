name: PR understanding with local Ollama
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        type: number
        required: true
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-understanding-${{ inputs.pr_number }}
  cancel-in-progress: false
jobs:
  questions:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, ollama]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Generate and publish three questions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          LLM_PROVIDER: ollama
          LLM_MODEL: ${{ vars.OLLAMA_MODEL }}
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          MAX_DIFF_CHARS: '12000'
          HTTP_TIMEOUT_SECONDS: '300'
          EXCLUDE_GLOBS: ${{ vars.EXCLUDE_GLOBS }}
        run: python3 -m pr_understanding --pr "$PR_NUMBER" --post
